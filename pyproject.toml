[project]
name = "agent-fabric"
version = "0.1.0"
description = "Agent Fabric — Channel/Memory 归中央，Execution 归节点"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "websockets>=12",
  "pyyaml>=6",
]

[project.optional-dependencies]
feishu = ["lark-oapi>=1.4"]
dev = ["pytest>=8"]

[project.scripts]
fabric-central = "fabric.central.app:main"
fabric-node = "fabric.node.daemon:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fabric*"]
